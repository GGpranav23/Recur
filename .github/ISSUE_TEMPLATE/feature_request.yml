name: Feature request
description: Suggest an idea or improvement for Recur.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like Recur to do?
      description: Describe the problem you're trying to solve, or the habit you're trying to track.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
      description: Optional. Describe how you picture it working.
