name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Don't rebuild for documentation-only changes (tags always build).
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single-file exe
        shell: pwsh
        run: |
          dotnet publish HabitApp/HabitApp.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -o publish

      - name: Zip the exe
        id: zip
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev" }
          $zip = "Recur-$version-win-x64.zip"
          Compress-Archive -Path publish/Recur.exe, LICENSE, README.md -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Recur-win-x64
          path: ${{ steps.zip.outputs.zip }}

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "${{ steps.zip.outputs.zip }}"
          # The release may already exist if it was created on github.com.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "Recur $tag" --notes-file .github/release-notes.md
          }
          exit $LASTEXITCODE
